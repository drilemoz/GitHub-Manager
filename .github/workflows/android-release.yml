name: GitHub Manager Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Validar e publicar release oficial
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Java 17 + cache Gradle
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/app/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Flutter 3.47.1
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true
          pub-cache: true

      - name: Testar verificador de assinatura
        run: python3 -m unittest discover -s tool -p test_verify_official_signing.py

      - name: Restaurar assinatura oficial
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_BASE64:-}" || { echo "KEYSTORE_BASE64 ausente"; exit 1; }
          test -n "${KEYSTORE_PASSWORD:-}" || { echo "KEYSTORE_PASSWORD ausente"; exit 1; }
          test -n "${KEY_ALIAS:-}" || { echo "KEY_ALIAS ausente"; exit 1; }
          test -n "${KEY_PASSWORD:-}" || { echo "KEY_PASSWORD ausente"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<KEYEOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../upload-keystore.jks
          KEYEOF
          python3 tool/verify_official_signing.py --keystore android/upload-keystore.jks

      - name: Dependências
        # Dependência Google Sign-In introduzida nesta versão. O lockfile
        # exige resolução na CI; restaurar --enforce-lockfile após commit.
        run: flutter pub get

      - name: Validar versão
        run: bash tool/check_version_sync.sh

      - name: Materializar Gradle Wrapper
        run: bash tool/bootstrap_gradle_wrapper.sh

      - name: Validar assinatura oficial
        shell: bash
        run: |
          cd android
          bash gradlew :app:validateOfficialSigning

      - name: Analisar código
        timeout-minutes: 3
        run: flutter analyze --no-pub

      - name: Executar testes
        timeout-minutes: 3
        run: flutter test --no-pub

      - name: Compilar APK oficial universal
        env:
          GRADLE_OPTS: -Dorg.gradle.vfs.watch=false
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: flutter build apk --release --no-pub --dart-define="GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID"

      - name: Verificar APK e certificado oficial
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          unzip -l "$APK" | grep 'lib/armeabi-v7a/libflutter.so' || { echo "APK sem armeabi-v7a"; exit 1; }
          unzip -l "$APK" | grep 'lib/arm64-v8a/libflutter.so' || { echo "APK sem arm64-v8a"; exit 1; }
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          APKANALYZER="$(find "$SDK_ROOT/cmdline-tools" "$SDK_ROOT/tools" -type f -name apkanalyzer 2>/dev/null | head -n1 || true)"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n1 || true)"
          test -x "$APKANALYZER" || { echo "apkanalyzer não encontrado"; exit 1; }
          test -x "$APKSIGNER" || { echo "apksigner não encontrado"; exit 1; }
          EXPECTED_ID="$(sed -n 's/^applicationId=//p' android/release-signing.properties | head -n1)"
          ACTUAL_ID="$("$APKANALYZER" manifest application-id "$APK")"
          VERSION="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)"
          test "$("$APKANALYZER" manifest version-code "$APK")" = "${VERSION##*+}"
          test "$("$APKANALYZER" manifest version-name "$APK")" = "${VERSION%%+*}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v${VERSION%%+*}"
          fi
          test "$ACTUAL_ID" = "$EXPECTED_ID" || { echo "applicationId incorreto: $ACTUAL_ID"; exit 1; }
          python3 tool/verify_official_signing.py --apksigner "$APKSIGNER" --apk "$APK"

      - name: Preparar nome oficial do APK
        id: package
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="build/app/outputs/flutter-apk/app-release.apk"
          VERSION="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)"
          VERSION_NAME="${VERSION%%+*}"
          VERSION_CODE="${VERSION##*+}"
          FILE="GitHub-Manager-${VERSION_NAME}-${VERSION_CODE}-universal-release.apk"
          mkdir -p dist
          cp "$SOURCE" "dist/$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Publicar APK oficial
        uses: actions/upload-artifact@v7.0.1
        with:
          path: dist/${{ steps.package.outputs.file }}
          # APK direto: evita ZIP externo/compressão adicional e acelera o download.
          archive: false
          if-no-files-found: error

      - name: Publicar APK em GitHub Releases
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tool/publish_apk_release.sh "dist/${{ steps.package.outputs.file }}"

      - name: Limpar material de assinatura
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties
